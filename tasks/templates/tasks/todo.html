{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <!-- Add Task -->
        <form method="POST" class="add-form">
            {% csrf_token %}

            <input
                type="text"
                name="task"
                placeholder="What do you need to do?"
                required
            >

            <input
                type="hidden"
                name="action"
                value="add"
            >

            <button type="submit" class="add-btn">
                Add
            </button>
        </form>


        <!-- Task List -->
        <ul class="task-list">

            {% for task in tasks %}

                <li class="task">

                    <span class="task-text {% if task.completed %}completed{% endif %}">
                        {{ task.text }}
                    </span>
<div class="actions">

    <!-- Complete -->
    {% if not task.completed %}

        <form method="POST">
            {% csrf_token %}

            <input
                type="hidden"
                name="action"
                value="complete"
            >

            <input
                type="hidden"
                name="index"
                value="{{ forloop.counter0 }}"
            >

            <button
                type="submit"
                class="complete-btn"
            >
                ✓
            </button>
        </form>

    {% endif %}


    <!-- Edit -->
    <form method="POST" class="edit-form">

        {% csrf_token %}

        <input
            type="hidden"
            name="action"
            value="edit"
        >

        <input
            type="hidden"
            name="index"
            value="{{ forloop.counter0 }}"
        >

        <input
            type="text"
            name="task"
            value="{{ task.text }}"
            class="edit-input"
        >

        <button
            type="submit"
            class="edit-btn"
        >
            ✏️
        </button>

    </form>


    <!-- Delete -->
    <form method="POST">

        {% csrf_token %}

        <input
            type="hidden"
            name="action"
            value="delete"
        >

        <input
            type="hidden"
            name="index"
            value="{{ forloop.counter0 }}"
        >

        <button
            type="submit"
            class="delete-btn"
        >
            ✕
        </button>

    </form>

</div>

                </li>

            {% empty %}

                <p class="empty-message">
                    No tasks yet. Add your first task!
                </p>

            {% endfor %}

        </ul>

    </div>

</body>
</html>
